name: Telemax tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned PyMax 2.5.0
        run: |
          python -m pip install --disable-pip-version-check "maxapi-python==2.5.0"
          python -m pip check
      - name: Compile sources
        run: python -m compileall -q telemax.py telemax_test.py
      - name: Run unit tests and real SDK contract tests
        run: |
          python -c 'import importlib.metadata; assert importlib.metadata.version("maxapi-python") == "2.5.0"'
          python -m unittest -v telemax_test
